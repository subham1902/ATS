[project]
name = "ats-bootstrap"
version = "0.0.0"
description = "ATS M010-00 repository bootstrap"
requires-python = "==3.11.15"
dependencies = ["ats"]

[dependency-groups]
dev = [
  "httpx2==2.10.0",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[tool.uv]
package = false

[tool.uv.sources]
ats = { workspace = true }

[tool.uv.workspace]
members = ["backend"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/src/ats/market/feeds/upstox_v3/proto/MarketDataFeedV3_pb2.*" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/src"]

[[tool.mypy.overrides]]
module = ["google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ats.market.feeds.upstox_v3.proto.MarketDataFeedV3_pb2"]
ignore_errors = true
