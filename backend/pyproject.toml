[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ats"
version = "0.0.0"
description = "ATS frozen package skeleton"
requires-python = "==3.11.15"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "MetaTrader5==5.0.5735; sys_platform == 'win32'",
  "pyarrow==23.0.1",
  "uvicorn[standard]==0.38.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ats"]
