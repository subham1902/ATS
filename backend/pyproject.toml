[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ats"
version = "0.0.0"
description = "ATS frozen package skeleton"
requires-python = "==3.11.15"
dependencies = [
  "fastapi==0.141.1",
  "protobuf==7.36.0",
  "pydantic==2.13.4",
  "websockets==15.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ats"]
