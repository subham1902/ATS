name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress run on main: the branch must always end with a
  # definite green or red signal rather than a superseded run's outcome.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Fail every Python step if any dependency in uv.lock disagrees with a
  # manifest. This is what makes the lockfile a contract instead of a hint.
  UV_FROZEN: "1"
  # All durability tests talk to the service container below. Declared once so
  # no step can forget it and silently skip the safety-critical suites.
  ATS_TEST_POSTGRES_DSN: "postgresql://ats:ats@127.0.0.1:5432/ats_test"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff (backend + tests)
        run: uv run ruff check backend tests
      - name: Mypy (strict)
        run: uv run mypy backend/src
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint/format run once from the workspace root: `eslint .` and
      # `prettier --check .` already cover every workspace package.
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend typecheck
        run: pnpm -r typecheck
      - name: Format check
        run: pnpm format:check

  python-smoke:
    name: Smoke / Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      # The governance layer: forbidden dependencies, secret/model-artifact
      # scan, ownership manifest completeness, no-live-credential markers.
      # These were previously never executed by CI at all.
      - name: Smoke tests
        run: uv run python -m pytest tests/smoke -q --junitxml=junit-smoke.xml
      - name: Assert tests preserve tracked inputs
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-smoke
          path: junit-smoke.xml

  python-contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Contract tests (architecture guards)
        run: uv run python -m pytest tests/contract -q --junitxml=junit-contract.xml
      - name: Assert tests preserve tracked inputs
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-contract
          path: junit-contract.xml

  python-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Unit tests
        # No -x: fail-fast hides the true failure surface behind the first
        # red test. The JUnit artifact records every outcome instead.
        run: uv run python -m pytest tests/unit backend/tests -q --junitxml=junit-unit.xml
      - name: Assert tests preserve tracked inputs
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml

  python-property:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Property tests
        run: uv run python -m pytest tests/property -q --junitxml=junit-property.xml
      - name: Assert tests preserve tracked inputs
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-property
          path: junit-property.xml

  python-durability:
    name: Durability & Faults (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
          POSTGRES_DB: ats_test
        # Postgres credentials are CI-fixture only; they grant no access to
        # anything outside this job's loopback container.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Verify the driver and DSN are actually present
        # Guard the guard: if psycopg or the DSN went missing, the suites below
        # would skip and the job would still be green.
        run: |
          uv run python -c "import psycopg; print('psycopg', psycopg.__version__)"
          test -n "$ATS_TEST_POSTGRES_DSN" || { echo "ATS_TEST_POSTGRES_DSN unset" >&2; exit 1; }
          uv run python -c "
          import os, psycopg
          with psycopg.connect(os.environ['ATS_TEST_POSTGRES_DSN']) as c:
              print(c.execute('select version()').fetchone()[0])
          "
      - name: Integration tests
        run: uv run python -m pytest tests/integration -q --junitxml=junit-integration.xml
      - name: Fault-injection tests
        run: uv run python -m pytest tests/faults -q --junitxml=junit-faults.xml
      - name: Assert safety-critical database suites executed
        # A skip in any of these means capital double-spend, single-use token
        # consumption, durable authority or reconciliation was never exercised.
        # That must fail the build, not pass silently.
        run: >
          uv run python scripts/ci/assert_critical_tests_ran.py
          junit-integration.xml junit-faults.xml --strict-names
      - name: Assert tests preserve tracked inputs
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-durability
          path: junit-*.xml

  python-coverage:
    name: Coverage (risk-weighted)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
          POSTGRES_DB: ats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Collect coverage
        # A repository-wide percentage would be a vanity metric. Coverage is
        # collected everywhere so the report is complete, but only the trusted
        # core below is gated.
        run: >
          uv run python -m pytest
          tests/contract tests/unit tests/property tests/smoke backend/tests
          --cov --cov-report=xml:coverage.xml --cov-report=term
          -q --junitxml=junit-coverage.xml
      - name: Gate the trusted core
        # Thresholds were measured locally on 2026-09-28 (contracts 95%,
        # kernel 84%) and set two points below the measurement. They may
        # ratchet upward only -- raising them is the default change.
        run: |
          uv run coverage report --include="*/ats/contracts/*" --fail-under=93
          uv run coverage report --include="*/ats/kernel/*" --fail-under=82
      - name: Assert tests preserve tracked inputs
        run: git diff --exit-code
      - name: Report (informational, all modules)
        if: always()
        run: uv run coverage report || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit-coverage.xml

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests
        # No --if-present: pnpm 11 forwards unknown flags to the script, and
        # vitest rejects `--if-present`. Every workspace package defines `test`.
        run: pnpm -r test
      - name: Production build
        run: pnpm --filter @ats/control-center build
      - name: Assert frontend preserves tracked inputs
        run: git diff --exit-code

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report into the security tab so findings are actionable rather than
          # only visible in a log line.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Previously gated on `repository.private == false`, which is always false
    # for this repository -- the job existed but could never execute. The
    # capability probe is now the only gate: it runs on every pull request and
    # performs the review when the dependency graph is available, otherwise
    # reports why it could not.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency-review capability
        id: capability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency graph unavailable on this repository; dependency review skipped (Dependabot still monitors declared manifests)."
          fi
      - uses: actions/dependency-review-action@v4
        if: steps.capability.outputs.supported == 'true'
        with:
          fail-on-severity: high

  mql-governance:
    name: MQL Governance & Native Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      # The observer's read-only guarantee was enforced by a source comment and
      # by review. This makes a reintroduced order path a build failure.
      - name: Assert MQL sources stay read-only
        run: uv run python scripts/ci/assert_mql_readonly.py metatrader connectors
      # scripts/test_gold_triple_native_parity.py has never been executed by CI.
      # It compiles the shared numerical core through its `#ifdef __cplusplus`
      # branch and checks it against the Python implementation -- the only
      # mechanical evidence that MQL and research agree on the rules.
      # ziglang is deliberately isolated: it is not in uv.lock and must not be.
      - name: Compile and run the native parity fixture
        env:
          # gold_triple_risk_research reads this at import time to locate raw
          # broker data. The parity harness uses synthetic fixtures only and
          # never opens it; a deliberately nonexistent path proves that.
          ATS_GOLD_TRIPLE_SOURCE: /nonexistent/parity-uses-synthetic-fixtures-only
        # pandas is intentionally unpinned. pandas 3 infers microsecond datetime
        # resolution, which silently zeroed every tactical signal while the
        # research scripts assumed nanoseconds. Running against the current
        # release is what surfaced that; pinning would hide the next one.
        run: |
          uv venv /tmp/parity
          uv pip install --python /tmp/parity/bin/python \
            "ziglang==0.13.0" numpy pandas numba
          /tmp/parity/bin/python scripts/test_gold_triple_native_parity.py -v
      - name: Assert tests preserve tracked inputs
        run: git diff --exit-code

  mql-compile:
    name: MetaEditor Compile (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MetaTrader 5 silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile $installer -UseBasicParsing -TimeoutSec 300
          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait -NoNewWindow
          # No silent skip: if MetaEditor is absent the job fails and says so,
          # rather than reporting green for a compile that never happened.
          $editor = Get-ChildItem -Path "C:\Program Files\MetaTrader 5","${env:APPDATA}\MetaQuotes" `
            -Filter "MetaEditor64.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $editor) {
            Write-Error "MetaEditor64.exe not found after install. If MetaQuotes downloads are unreliable on hosted runners, move this job to a self-hosted Windows runner rather than relaxing the gate."
          }
          "METAEDITOR=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile the observer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $source = Join-Path $PWD "metatrader\Experts\ATSSmallAccount\ATSSmallAccountObserver.mq5"
          $log    = Join-Path $env:RUNNER_TEMP "compile.log"
          # MetaEditor on this toolchain returns process status 1 even when its
          # diagnostic log reports zero errors and the executable is produced.
          # The log and the binary are therefore authoritative, not the exit code.
          $process = Start-Process -FilePath $env:METAEDITOR `
            -ArgumentList "/compile:`"$source`"","/log:`"$log`"" -Wait -PassThru -NoNewWindow
          Write-Host "MetaEditor process status: $($process.ExitCode)"
          if (-not (Test-Path $log)) { Write-Error "No diagnostic log was produced." }
          # MetaEditor writes the log as UTF-16LE.
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host "----- MetaEditor log -----"
          Write-Host $text
          if ($text -notmatch "0\s+error") { Write-Error "Compiler log does not report zero errors." }
          $binary = [System.IO.Path]::ChangeExtension($source, ".ex5")
          if (-not (Test-Path $binary)) { Write-Error "No .ex5 was produced." }
          $hash = (Get-FileHash -Path $binary -Algorithm SHA256).Hash
          Write-Host "source sha256:  $((Get-FileHash -Path $source -Algorithm SHA256).Hash)"
          Write-Host "ex5 sha256:     $hash"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metaeditor-compile-log
          path: ${{ runner.temp }}/compile.log
      - name: Assert the build left no tracked artifact
        shell: pwsh
        run: git diff --exit-code

  research-baselines:
    name: Research Baselines & Promotion Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - run: uv sync --frozen
      # The later-period results are the only evidence this project has about
      # whether anything works, and they live in editable markdown. This freezes
      # them against a committed baseline so an unfavourable number cannot
      # quietly become favourable, and refuses any documented lifecycle above
      # RESEARCH whose VALIDATION.md still records absent evidence.
      - name: Assert recorded research results and lifecycles
        run: uv run python scripts/ci/assert_research_baselines.py
      - name: Assert the check preserved tracked inputs
        run: git diff --exit-code
